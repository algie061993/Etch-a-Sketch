<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <h1>Etch-A-Sketch</h1>

    <!-- Controls section for the button and mode options -->
    <div class="controls">
      <button id="reset-btn">New Grid Size</button>
      <div class="mode-buttons">
        <button id="black-btn" class="active">Black</button>
        <button id="random-btn">Random RGB</button>
        <button id="darken-btn">Progressive Darkening</button>
        <button id="clear-btn">Clear Canvas</button>
      </div>
    </div>

    <!-- Main Grid Container -->
    <div id="container"></div>

    <script src="/JavaScript/script.js"></script>
  </body>
</html>
